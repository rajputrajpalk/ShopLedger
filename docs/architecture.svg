<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger with browser UI, Express server, routers, library modules, configuration, JSON store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="arrowHot" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#c2415d"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:13px}
      .title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#536176}
      .head{font-size:14px;font-weight:700}.small{font-size:12px;fill:#536176}
      .node{fill:#fff;stroke:#9aa9bc;stroke-width:1.4}.group{fill:#f4f7fb;stroke:#cbd5e1;stroke-width:1.2}
      .hot{fill:#fff0f2;stroke:#c2415d;stroke-width:2}.hotText{fill:#9f2341}
      .flowbox{fill:#fff;stroke:#a8b6c8;stroke-width:1.2}.flowNum{fill:#1e3a5f}
      .line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}
      .lineHot{fill:none;stroke:#c2415d;stroke-width:2;marker-end:url(#arrowHot)}
      .dashed{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#fbfcfe"/>
  <text x="32" y="42" class="title">ShopLedger | Application architecture</text>
  <text x="32" y="66" class="sub">Express POS · Khata ledger · GST checkout · Printable invoice</text>
  <rect x="866" y="23" width="302" height="54" rx="9" class="hot"/>
  <rect x="882" y="39" width="18" height="18" rx="4" class="hot"/>
  <text x="910" y="53" class="small">Ticket focus: lib/invoice.js and lib/tax.js</text>

  <!-- Architecture nodes -->
  <rect x="24" y="112" width="165" height="424" rx="12" class="group"/>
  <text x="40" y="138" class="head">Browser UI</text>
  <rect x="39" y="153" width="135" height="75" rx="8" class="node"/>
  <text x="51" y="177" font-weight="700">public/</text><text x="51" y="198" class="small">index.html</text><text x="51" y="216" class="small">css/style.css</text>
  <rect x="39" y="240" width="135" height="88" rx="8" class="node"/>
  <text x="51" y="264" font-weight="700">js/app.js</text><text x="51" y="285" class="small">Catalog · cart</text><text x="51" y="305" class="small">Preview · place order</text>
  <text x="40" y="365" class="small">HTTP requests</text><text x="40" y="386" class="small">/api/*</text><text x="40" y="407" class="small">invoice page</text>

  <rect x="218" y="153" width="174" height="126" rx="10" class="node"/>
  <text x="234" y="180" class="head">server.js</text>
  <text x="234" y="204" class="small">Express setup</text><text x="234" y="224" class="small">Static public/ + /api</text><text x="234" y="244" class="small">GET invoice route</text><text x="234" y="264" class="small">app.listen(config.port)</text>

  <rect x="418" y="112" width="203" height="424" rx="12" class="group"/>
  <text x="434" y="138" class="head">routes/</text>
  <rect x="433" y="153" width="173" height="76" rx="8" class="node"/>
  <text x="445" y="176" font-weight="700">products.js</text><text x="445" y="198" class="small">products · coupons</text>
  <rect x="433" y="240" width="173" height="91" rx="8" class="node"/>
  <text x="445" y="263" font-weight="700">orders.js</text><text x="445" y="285" class="small">list/get · POST order</text><text x="445" y="306" class="small">cancel order</text>
  <rect x="433" y="342" width="173" height="76" rx="8" class="node"/>
  <text x="445" y="365" font-weight="700">customers.js</text><text x="445" y="387" class="small">list · settle Khata</text>
  <rect x="433" y="429" width="173" height="88" rx="8" class="node"/>
  <text x="445" y="452" font-weight="700">reports.js</text><text x="445" y="474" class="small">dashboard · GST recon</text><text x="445" y="495" class="small">pricing preview · export</text>

  <rect x="647" y="112" width="344" height="424" rx="12" class="group"/>
  <text x="663" y="138" class="head">lib/ business modules</text>
  <rect x="662" y="153" width="151" height="61" rx="8" class="hot"/><text x="674" y="177" class="head hotText">invoice.js</text><text x="674" y="198" class="small">computeInvoiceFigures · render</text>
  <rect x="823" y="153" width="151" height="61" rx="8" class="hot"/><text x="835" y="177" class="head hotText">tax.js</text><text x="835" y="198" class="small">HSN rate · CGST/SGST</text>
  <rect x="662" y="225" width="151" height="61" rx="8" class="node"/><text x="674" y="249" class="head">pricing.js</text><text x="674" y="270" class="small">subtotal · computeTotals</text>
  <rect x="823" y="225" width="151" height="61" rx="8" class="node"/><text x="835" y="249" class="head">coupons.js</text><text x="835" y="270" class="small">validate · discount</text>
  <rect x="662" y="297" width="151" height="61" rx="8" class="node"/><text x="674" y="321" class="head">inventory.js</text><text x="674" y="342" class="small">find · check · reserve</text>
  <rect x="823" y="297" width="151" height="61" rx="8" class="node"/><text x="835" y="321" class="head">orders.js</text><text x="835" y="342" class="small">add · get · cancel · list</text>
  <rect x="662" y="369" width="151" height="61" rx="8" class="node"/><text x="674" y="393" class="head">ledger.js</text><text x="674" y="414" class="small">Khata · settlement</text>
  <rect x="823" y="369" width="151" height="61" rx="8" class="node"/><text x="835" y="393" class="head">reports.js</text><text x="835" y="414" class="small">dashboard · reconciliation</text>
  <rect x="662" y="441" width="151" height="61" rx="8" class="node"/><text x="674" y="465" class="head">store.js</text><text x="674" y="486" class="small">read · write · audit</text>
  <rect x="823" y="441" width="151" height="61" rx="8" class="node"/><text x="835" y="465" class="head">dates.js</text><text x="835" y="486" class="small">today · date keys · FY</text>

  <rect x="1017" y="153" width="158" height="105" rx="10" class="node"/>
  <text x="1031" y="180" class="head">config.js</text><text x="1031" y="202" class="small">shop · GST slabs</text><text x="1031" y="222" class="small">coupons · defaults</text><text x="1031" y="242" class="small">port · admin key</text>
  <rect x="1017" y="369" width="158" height="105" rx="10" class="node"/>
  <text x="1031" y="396" class="head">data/db.json</text><text x="1031" y="418" class="small">products · orders</text><text x="1031" y="438" class="small">customers · settlements</text><text x="1031" y="458" class="small">audit log</text>

  <!-- Main relationships -->
  <path d="M189 277 H218" class="line"/>
  <path d="M392 216 H405 V192 H433" class="line"/>
  <path d="M392 228 H405 V285 H433" class="line"/>
  <path d="M392 240 H405 V380 H433" class="line"/>
  <path d="M392 252 H405 V472 H433" class="line"/>
  <path d="M621 282 H662" class="line"/>
  <path d="M621 285 H635 V267 H662" class="line"/>
  <path d="M621 286 H633 V327 H662" class="line"/>
  <path d="M621 290 H637 V398 H662" class="line"/>
  <path d="M621 292 H641 V471 H662" class="line"/>
  <path d="M974 255 H1000 V205 H1017" class="line"/>
  <path d="M813 255 H823" class="line"/>
  <path d="M813 183 H823" class="lineHot"/>
  <path d="M974 183 H1000 V205 H1017" class="lineHot dashed"/>
  <path d="M813 471 H1017" class="line"/>
  <path d="M974 398 H1000 V421 H1017" class="line"/>
  <path d="M392 265 H403 V558 H984 V421 H1017" class="line dashed"/>
  <text x="24" y="558" class="small">Arrows show request dispatch and module/data dependencies; numbered sequence below details order placement.</text>

  <!-- Numbered order flow -->
  <text x="32" y="593" class="head">Order placement flow</text>
  <g transform="translate(28,610)">
    <rect width="158" height="151" rx="11" class="flowbox"/><circle cx="21" cy="22" r="13" class="flowNum"/><text x="17" y="27" fill="#fff" font-weight="700">1</text>
    <text x="43" y="27" font-weight="700">Browser</text><text x="14" y="57" class="small">public/js/app.js</text><text x="14" y="79" class="small">POST /api/orders</text><text x="14" y="110" class="small">items + coupon</text><text x="14" y="130" class="small">+ customer/payment</text>
    <path d="M159 76 H170" class="line"/>
  </g>
  <g transform="translate(194,610)">
    <rect width="158" height="151" rx="11" class="flowbox"/><circle cx="21" cy="22" r="13" class="flowNum"/><text x="17" y="27" fill="#fff" font-weight="700">2</text>
    <text x="43" y="27" font-weight="700">Route checks</text><text x="14" y="57" class="small">routes/orders.js</text><text x="14" y="79" class="small">product lookup</text><text x="14" y="101" class="small">quantity parsing</text><text x="14" y="123" class="small">stock validation</text>
    <path d="M159 76 H170" class="line"/>
  </g>
  <g transform="translate(360,610)">
    <rect width="158" height="151" rx="11" class="flowbox"/><circle cx="21" cy="22" r="13" class="flowNum"/><text x="17" y="27" fill="#fff" font-weight="700">3</text>
    <text x="43" y="27" font-weight="700">Price &amp; tax</text><text x="14" y="57" class="small">pricing.computeTotals</text><text x="14" y="79" class="small">coupons.calculate</text><text x="14" y="101" class="small">tax.getRateForItem</text><text x="14" y="123" class="small">discount → taxable → GST</text>
    <path d="M159 76 H170" class="line"/>
  </g>
  <g transform="translate(526,610)">
    <rect width="158" height="151" rx="11" class="flowbox"/><circle cx="21" cy="22" r="13" class="flowNum"/><text x="17" y="27" fill="#fff" font-weight="700">4</text>
    <text x="43" y="27" font-weight="700">Khata (if used)</text><text x="14" y="57" class="small">ledger.chargeOrderToKhata</text><text x="14" y="79" class="small">credit limit check</text><text x="14" y="101" class="small">updates customer billed</text><text x="14" y="123" class="small">balance in memory</text>
    <path d="M159 76 H170" class="line"/>
  </g>
  <g transform="translate(692,610)">
    <rect width="158" height="151" rx="11" class="flowbox"/><circle cx="21" cy="22" r="13" class="flowNum"/><text x="17" y="27" fill="#fff" font-weight="700">5</text>
    <text x="43" y="27" font-weight="700">Reserve stock</text><text x="14" y="57" class="small">inventory.reserve</text><text x="14" y="79" class="small">deduct item quantities</text><text x="14" y="101" class="small">from product stock</text>
    <path d="M159 76 H170" class="line"/>
  </g>
  <g transform="translate(858,610)">
    <rect width="158" height="151" rx="11" class="flowbox"/><circle cx="21" cy="22" r="13" class="flowNum"/><text x="17" y="27" fill="#fff" font-weight="700">6</text>
    <text x="43" y="27" font-weight="700">Build &amp; audit</text><text x="14" y="57" class="small">orders.add</text><text x="14" y="79" class="small">appendAudit</text><text x="14" y="101" class="small">order + audit + stock</text><text x="14" y="123" class="small">ready for persistence</text>
    <path d="M159 76 H170" class="line"/>
  </g>
  <g transform="translate(1024,610)">
    <rect width="158" height="151" rx="11" class="flowbox"/><circle cx="21" cy="22" r="13" class="flowNum"/><text x="17" y="27" fill="#fff" font-weight="700">7</text>
    <text x="43" y="27" font-weight="700">Save &amp; respond</text><text x="14" y="57" class="small">store.write(db)</text><text x="14" y="79" class="small">writes data/db.json</text><text x="14" y="101" class="small">HTTP 201 + order</text><text x="14" y="123" class="small">invoice link in UI</text>
  </g>
</svg>
